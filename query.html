<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>陶喆活动抽奖查询</title>
    <style>
        * {
            box-sizing: border-box;
        }

        /* 统一滚动条样式优化 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(19, 78, 94, 0.3); /* 使用深绿色调 */
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: content-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(19, 78, 94, 0.6);
            background-clip: content-box;
        }

        html {
            overflow-y: scroll; /* 强制显示滚动条，防止页面抖动 */
            overflow-x: hidden; /* 强制隐藏横向滚动条 */
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: linear-gradient(135deg, #134E5E, #71B280);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .header p {
            margin: 10px 0 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .container {
            flex: 1;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px 20px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            margin-top: -20px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
            font-size: 0.9rem;
        }

        input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        
        input[type="text"]:focus, input[type="tel"]:focus {
            border-color: #134E5E;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #134E5E;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .btn:active {
            background-color: #0e3d4a;
        }

        .result-area {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px dashed #eee;
            display: none; /* 默认隐藏 */
        }

        .status-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            display: block;
        }

        .status-text {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status-desc {
            color: #777;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* 状态样式 */
        .status-success { color: #27ae60; }
        .status-fail { color: #7f8c8d; }
        .status-error { color: #e74c3c; }

        .winner-form {
            text-align: left;
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .community-section {
            margin-top: 30px;
            text-align: center;
            padding: 20px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }
        
        .qrcode-placeholder {
            width: 150px;
            height: 150px;
            background-color: #eee;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 0.8rem;
        }

        .footer-info {
            text-align: center;
            font-size: 0.8rem;
            color: #999;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>抽奖结果查询</h1>
        <p>输入订单号，查询您的好运</p>
    </div>

    <div class="container">
        <div class="card">
            <div class="input-group">
                <label for="orderNo">订单号</label>
                <input type="text" id="orderNo" placeholder="请输入您的订单编号">
            </div>
            <button class="btn" onclick="checkOrder()">立即查询</button>

            <!-- 查询结果区域 -->
            <div class="result-area" id="resultArea">
                <!-- 动态内容将注入这里 -->
            </div>
        </div>

        <div class="community-section">
            <h3 style="margin-top: 0; color: #333;">加入陶喆粉丝社群</h3>
            <p style="color: #666; font-size: 0.9rem;">获取最新活动资讯，不错过每一份福利！</p>
            <div class="qrcode-placeholder">
                [二维码图片占位]
            </div>
            <p style="font-size: 0.8rem; color: #999;">长按识别二维码加入</p>
        </div>

        <div class="footer-info">
            
        </div>
    </div>

    <script>
        function checkOrder() {
            const orderNo = document.getElementById('orderNo').value.trim();
            const resultArea = document.getElementById('resultArea');
            
            if (!orderNo) {
                alert('请输入订单号');
                return;
            }

            // 模拟查询逻辑
            // 实际开发中应调用后端 API
            resultArea.style.display = 'block';
            
            let html = '';

            // 模拟三种状态：
            // 1. 中奖 (输入 "888" 模拟)
            // 2. 未中奖 (输入 "000" 模拟)
            // 3. 不存在 (其他)
            
            if (orderNo === '888') {
                // 中奖状态
                html = `
                    <div class="status-icon status-success">🎉</div>
                    <div class="status-text status-success">恭喜！您已中奖！</div>
                    <div class="status-desc">请填写下方信息以便我们为您发放奖品</div>
                    
                    <div class="winner-form">
                        <div class="input-group">
                            <label>姓名</label>
                            <input type="text" placeholder="请输入您的真实姓名">
                        </div>
                        <div class="input-group">
                            <label>联系电话</label>
                            <input type="tel" placeholder="请输入您的手机号码">
                        </div>
                        <button class="btn" onclick="alert('提交成功！请保持电话畅通。')">提交登记</button>
                    </div>
                `;
            } else if (orderNo === '000') {
                // 未中奖状态
                html = `
                    <div class="status-icon status-fail">😔</div>
                    <div class="status-text status-fail">很遗憾，未中奖</div>
                    <div class="status-desc">感谢您的参与，请继续关注我们的后续活动。</div>
                `;
            } else {
                // 订单不存在
                html = `
                    <div class="status-icon status-error">⚠️</div>
                    <div class="status-text status-error">未找到该订单</div>
                    <div class="status-desc">请核对订单号是否输入正确。</div>
                `;
            }

            resultArea.innerHTML = html;
        }
    </script>
</body>
</html>
