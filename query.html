<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陶喆订单抽奖 - 结果查询</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        .header {
            background: linear-gradient(135deg, #134E5E, #71B280);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-top: -20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        input[type="text"]:focus, input[type="tel"]:focus {
            border-color: #134E5E;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #134E5E;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .btn:active {
            background-color: #0e3d4a;
        }

        .result-area {
            margin-top: 20px;
            display: none;
            text-align: center;
        }

        .status-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .status-text {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status-desc {
            color: #666;
            margin-bottom: 20px;
        }

        .status-success { color: #2ecc71; }
        .status-error { color: #e74c3c; }
        .status-info { color: #3498db; }

        .winner-form {
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 20px;
            display: none;
        }

        .community-section {
            margin-top: 40px;
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .qrcode-placeholder {
            width: 150px;
            height: 150px;
            background-color: #eee;
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 0.8rem;
        }

        .footer {
            text-align: center;
            color: #999;
            font-size: 0.8rem;
            margin-top: 30px;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>陶喆订单抽奖查询</h1>
        <p>输入订单号查询中奖结果</p>
    </div>

    <div class="container">
        <div class="search-box">
            <div class="input-group">
                <label for="orderInput">订单号</label>
                <input type="text" id="orderInput" placeholder="请输入您的订单号">
            </div>
            <button class="btn" id="queryBtn">立即查询</button>
        </div>

        <div class="result-area" id="resultArea">
            <div class="status-icon" id="statusIcon"></div>
            <div class="status-text" id="statusText"></div>
            <div class="status-desc" id="statusDesc"></div>

            <div class="winner-form" id="winnerForm">
                <div style="margin-bottom: 15px; font-weight: bold;">请填写领奖信息：</div>
                <div class="input-group">
                    <label>姓名</label>
                    <input type="text" placeholder="请输入真实姓名">
                </div>
                <div class="input-group">
                    <label>电话</label>
                    <input type="tel" placeholder="请输入联系电话">
                </div>
                <button class="btn" onclick="alert('登记成功！请等待工作人员联系。')">提交登记</button>
            </div>
        </div>

        <div class="community-section">
            <h3>加入陶喆粉丝社群</h3>
            <p>获取最新活动资讯，与其他粉丝互动</p>
            <div class="qrcode-placeholder">
                社群二维码<br>(此处放置图片)
            </div>
            <p style="font-size: 0.8rem; color: #666;">长按识别二维码加入</p>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 享乐派需求管理部
    </div>

    <script>
        const queryBtn = document.getElementById('queryBtn');
        const resultArea = document.getElementById('resultArea');
        const statusIcon = document.getElementById('statusIcon');
        const statusText = document.getElementById('statusText');
        const statusDesc = document.getElementById('statusDesc');
        const winnerForm = document.getElementById('winnerForm');

        queryBtn.addEventListener('click', () => {
            const orderId = document.getElementById('orderInput').value.trim();
            
            if (!orderId) {
                alert('请输入订单号');
                return;
            }

            // 模拟查询逻辑
            resultArea.style.display = 'block';
            winnerForm.style.display = 'none';

            if (orderId === '888') {
                // 中奖
                statusIcon.innerHTML = '🎉';
                statusIcon.className = 'status-icon status-success';
                statusText.innerHTML = '恭喜！您中奖了！';
                statusText.className = 'status-text status-success';
                statusDesc.innerHTML = '您的订单号 ' + orderId + ' 已中奖，请尽快登记信息。';
                winnerForm.style.display = 'block';
            } else if (orderId === '000') {
                // 未中奖
                statusIcon.innerHTML = '🥺';
                statusIcon.className = 'status-icon status-info';
                statusText.innerHTML = '很遗憾，未中奖';
                statusText.className = 'status-text status-info';
                statusDesc.innerHTML = '感谢您的参与，下次好运！';
            } else {
                // 不存在
                statusIcon.innerHTML = '🔍';
                statusIcon.className = 'status-icon status-error';
                statusText.innerHTML = '未找到该订单';
                statusText.className = 'status-text status-error';
                statusDesc.innerHTML = '请核对订单号是否正确。';
            }
        });
    </script>
</body>
</html>
