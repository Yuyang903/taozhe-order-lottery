<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陶喆订单抽奖 - 直播抽奖端</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #8e44ad, #c0392b); /* 紫红配色，喜庆大气 */
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .header {
            position: absolute;
            top: 20px;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }

        .lottery-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.2);
            text-align: center;
            width: 90%;
            max-width: 1400px; /* 增加宽度以容纳长订单号 */
        }

        .number-display {
            font-size: 3rem; /* 稍微调小字体以适应长订单 */
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            color: #f1c40f;
            text-shadow: 0 0 20px rgba(241, 196, 15, 0.5);
            margin: 20px 0;
            min-height: 1.2em;
            display: flex;
            justify-content: center;
            overflow: hidden;
            flex-wrap: nowrap;
        }

        .digit-slot {
            display: inline-block;
            width: 0.7em; /* 稍微加宽 */
            height: 1.2em;
            line-height: 1.2em;
            position: relative;
            overflow: hidden;
            background: rgba(0,0,0,0.1);
            margin: 0 1px;
            border-radius: 4px;
        }

        .digit-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            transition: transform 0.5s cubic-bezier(0.1, 0.7, 0.1, 1);
        }

        .digit-strip div {
            height: 1.2em;
            line-height: 1.2em;
            text-align: center;
        }

        /* 滚动动画 */
        @keyframes scroll-animation {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); } 
        }

        .scrolling .digit-strip {
            animation: scroll-animation 0.2s linear infinite;
        }

        .controls {
            margin-top: 40px;
        }

        .btn {
            background: linear-gradient(to bottom, #f1c40f, #f39c12);
            border: none;
            padding: 15px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #c0392b;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #d35400, 0 5px 10px rgba(0,0,0,0.3);
            transition: all 0.1s;
            outline: none;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #d35400, 0 0 5px rgba(0,0,0,0.3);
        }

        .btn.stop {
            background: linear-gradient(to bottom, #e74c3c, #c0392b);
            color: #fff;
            box-shadow: 0 4px 0 #7f2f26, 0 5px 10px rgba(0,0,0,0.3);
        }
        
        .btn.stop:active {
            box-shadow: 0 0 0 #7f2f26, 0 0 5px rgba(0,0,0,0.3);
        }

        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        /* 中奖特效动画 */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .winner {
            animation: pulse 0.5s infinite;
            /* 保持金色，不变成白色 */
            color: #f1c40f; 
            text-shadow: 0 0 30px #f1c40f, 0 0 60px #e67e22;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }
    </style>
</head>

        let isRunning = false;
        const display = document.getElementById('display');
        const btn = document.getElementById('actionBtn');
        
        // 计算最大长度
        const MAX_LEN = Math.max(...orders.map(o => o.length));
        // 扩展字符集：数字 + 大写字母 + 连字符
        const CHARS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-';
        // 为了让滚动效果更连贯，重复多次
        const STRIP_CONTENT = (CHARS + CHARS).split('').map(n => `<div>${n}</div>`).join('') + `<div>&nbsp;</div>`; 
        // 最后一个是空白占位符

        // 初始化显示槽
        function initSlots() {
            display.innerHTML = '';
            for (let i = 0; i < MAX_LEN; i++) {
                const slot = document.createElement('div');
                slot.className = 'digit-slot';
                const strip = document.createElement('div');
                strip.className = 'digit-strip';
                strip.innerHTML = STRIP_CONTENT;
                slot.appendChild(strip);
                display.appendChild(slot);
            }
        }

        // 初始化
        initSlots();

        function startLottery() {
            if (isRunning) return;
            isRunning = true;
            btn.textContent = "停止";
            btn.classList.add('stop');
            display.classList.remove('winner');
            
            // 为每个槽位添加滚动动画类
            const slots = document.querySelectorAll('.digit-slot');
            slots.forEach((slot, index) => {
                slot.classList.add('scrolling');
                slot.querySelector('.digit-strip').style.animationDelay = `-${Math.random() * 0.5}s`;
                slot.querySelector('.digit-strip').style.transform = 'translateY(0)'; 
            });
        }

        function stopLottery() {
            if (!isRunning) return;
            isRunning = false;
            btn.textContent = "开始抽奖";
            btn.classList.remove('stop');
            
            // 模拟最终中奖结果
            const finalIndex = Math.floor(Math.random() * orders.length);
            const winningNumber = orders[finalIndex]; 
            
            const slots = document.querySelectorAll('.digit-slot');
            
            // 计算居中对齐的起始位置
            const len = winningNumber.length;
            const startOffset = Math.floor((MAX_LEN - len) / 2);
            
            slots.forEach((slot, index) => {
                slot.classList.remove('scrolling');
                const strip = slot.querySelector('.digit-strip');
                
                let char = '';
                // 判断当前 slot 是否在显示范围内
                if (index >= startOffset && index < startOffset + len) {
                    char = winningNumber[index - startOffset];
                } else {
                    char = '&nbsp;'; // 空白
                }

                let targetIndex = -1;
                if (char === '&nbsp;') {
                    targetIndex = CHARS.length * 2; // 指向最后一个空白 div
                } else {
                    // 找到字符在 CHARS 中的位置
                    // 优先找第二组的字符，以保证是从上往下滚动的视觉惯性
                    const baseIndex = CHARS.indexOf(char);
                    if (baseIndex !== -1) {
                        targetIndex = baseIndex + CHARS.length; // 使用第二组
                    } else {
                        targetIndex = 0; // fallback
                    }
                }
                
                const lineHeight = 1.2; // em
                const targetY = -(targetIndex * lineHeight);
                
                strip.style.transform = `translateY(${targetY}em)`;
                strip.style.transition = `transform 0.5s cubic-bezier(0.1, 0.7, 0.1, 1) ${index * 0.05}s`;
            });

            // 动画结束后添加闪烁特效
            setTimeout(() => {
                display.classList.add('winner');
                createConfetti();
            }, MAX_LEN * 50 + 500);
        }

        function toggleLottery() {
            if (isRunning) {
                stopLottery();
            } else {
                startLottery();
            }
        }

        // 绑定事件
        btn.addEventListener('click', toggleLottery);
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // 防止页面滚动
                toggleLottery();
            }
        });

        // 简单的礼花特效
        function createConfetti() {
            const colors = ['#f1c40f', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = -10 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 1) + 's';
                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 3000);
            }
        }
