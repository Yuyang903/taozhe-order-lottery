<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陶喆订单抽奖 - 直播抽奖端</title>
    <style>
        /* 统一滚动条样式优化 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(241, 196, 15, 0.3);
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: content-box;
            transition: all 0.3s;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(241, 196, 15, 0.6);
            background-clip: content-box;
        }

        /* 针对 history-box 特别优化 */
        .history-box::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .history-box::-webkit-scrollbar-thumb {
            background: rgba(241, 196, 15, 0.4);
            background-clip: content-box;
        }

        html {
            overflow-y: scroll; /* 强制显示滚动条，防止页面抖动 */
            overflow-x: hidden; /* 强制隐藏横向滚动条 */
        }

        body {
            margin: 0;
            padding: 0;
            /* overflow-y: auto; 已在 html 中强制开启 */
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #134E5E, #71B280); /* 绿色系配色 */
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* 改为 flex-start 以适应内容增长 */
            min-height: 100vh;
            padding-top: 50px; /* 增加顶部间距 */
            box-sizing: border-box;
        }

        .header {
            position: static; /* 不再绝对定位 */
            margin-bottom: 30px;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }

        .lottery-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.2);
            text-align: center;
            width: 90%;
            max-width: 1400px; /* 增加宽度以容纳长订单号 */
            position: relative;
            z-index: 20;
        }

        .number-display {
            font-size: 3rem; /* 稍微调小字体以适应长订单 */
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            color: #f1c40f;
            text-shadow: 0 0 20px rgba(241, 196, 15, 0.5);
            margin: 20px 0;
            min-height: 1.2em;
            display: flex;
            justify-content: center;
            overflow: hidden;
            flex-wrap: nowrap;
        }

        .digit-slot {
            display: inline-block;
            width: 0.7em; /* 稍微加宽 */
            height: 1.2em;
            line-height: 1.2em;
            position: relative;
            overflow: hidden;
            background: rgba(0,0,0,0.1);
            margin: 0 1px;
            border-radius: 4px;
        }

        .digit-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            transition: transform 0.5s cubic-bezier(0.1, 0.7, 0.1, 1);
        }

        .digit-strip div {
            height: 1.2em;
            line-height: 1.2em;
            text-align: center;
        }

        /* 滚动动画 */
        @keyframes scroll-animation {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); } 
        }

        .scrolling .digit-strip {
            animation: scroll-animation 0.2s linear infinite;
        }

        .controls {
            margin-top: 40px;
        }

        .btn {
            background: linear-gradient(to bottom, #f1c40f, #f39c12);
            border: none;
            padding: 15px 0; /* 修改为上下padding，左右由width控制 */
            width: 260px;    /* 固定宽度 */
            font-size: 1.5rem;
            font-weight: bold;
            color: #c0392b;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #d35400, 0 5px 10px rgba(0,0,0,0.3);
            transition: all 0.1s;
            outline: none;
            text-align: center; /* 确保文字居中 */
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #d35400, 0 0 5px rgba(0,0,0,0.3);
        }

        .btn.stop {
            background: linear-gradient(to bottom, #e74c3c, #c0392b);
            color: #fff;
            box-shadow: 0 4px 0 #7f2f26, 0 5px 10px rgba(0,0,0,0.3);
        }
        
        .btn.stop:active {
            box-shadow: 0 0 0 #7f2f26, 0 0 5px rgba(0,0,0,0.3);
        }

        .footer {
            position: relative;
            margin-top: 40px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        /* 中奖特效动画 */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); } /* 减小放大倍数 */
            100% { transform: scale(1); }
        }

        .winner {
            animation: pulse 0.5s infinite;
            /* 保持金色，不变成白色 */
            color: #f1c40f; 
            text-shadow: 0 0 30px #f1c40f, 0 0 60px #e67e22;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }

        /* 中奖记录样式 */
        .history-container {
            width: 90%;
            max-width: 1400px;
            margin-top: 20px;
            display: flex;
            justify-content: flex-start;
            /* 保证在footer之上 */
            z-index: 10;
        }
        .history-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px 25px;
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 200px;
            overflow-y: scroll;
            width: 350px; 
            text-align: left;
            backdrop-filter: blur(5px);
        }
        .history-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #f1c40f;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 2px;
        }
        .history-time {
            color: rgba(255,255,255,0.6);
            margin-left: 10px;
        }

        /* 登录遮罩层样式 */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #134E5E, #71B280);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 300px;
        }

        .login-title {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #fff;
            font-weight: bold;
        }

        .login-input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.9);
            box-sizing: border-box;
            outline: none;
            text-align: center;
        }

        .login-input:focus {
            box-shadow: 0 0 0 3px rgba(241, 196, 15, 0.5);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #f1c40f;
            color: #134E5E;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .login-btn:hover {
            background: #f39c12;
            transform: translateY(-2px);
        }

        .login-hint {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- 登录遮罩层 -->
    <div id="loginOverlay">
        <div class="login-box">
            <div class="login-title">系统登录</div>
            <input type="password" id="passwordInput" class="login-input" placeholder="请输入访问密码">
            <button class="login-btn" onclick="checkLogin()">进入系统</button>
            <div class="login-hint">测试密码：XLP123</div>
        </div>
    </div>

    <div class="header">陶喆订单抽奖活动</div>

    <div class="lottery-box">
        <div style="font-size: 1.2rem; opacity: 0.8; margin-bottom: 10px;">幸运订单号</div>
        <div class="number-display" id="display">LOADING...</div>
        <div class="controls">
            <button class="btn" id="actionBtn">开始抽奖</button>
        </div>
    </div>

    <!-- 中奖记录区域 -->
    <div class="history-container">
        <div class="history-box">
            <div class="history-title">
                <span>中奖记录</span>
            </div>
            <div id="historyList">
                <div style="text-align: center; padding: 20px; color: rgba(255,255,255,0.3); font-size: 0.9rem;">
                    暂无中奖记录
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        按空格键或点击按钮控制 | <a href="query.html" target="_blank" style="color: rgba(255,255,255,0.7); text-decoration: none; border-bottom: 1px dashed rgba(255,255,255,0.5);">前往结果查询页</a>
    </div>

    <script>
        // 登录验证逻辑
        function checkLogin() {
            const pwd = document.getElementById('passwordInput').value;
            if (pwd === 'XLP123') {
                document.getElementById('loginOverlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loginOverlay').style.display = 'none';
                }, 500);
            } else {
                alert('密码错误，请重新输入');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        // 监听回车键登录
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkLogin();
            }
        });

        // 页面加载时聚焦密码框
        window.onload = function() {
            document.getElementById('passwordInput').focus();
        }

        // 数据变量
        let fullOrders = []; // 所有订单
        let winners = [];    // 已中奖订单
        let pool = [];       // 当前有效奖池 (all - winners)
        
        let MAX_LEN = 0;
        let STRIP_CONTENT = '';
        const CHARS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-';

        let isRunning = false;
        const display = document.getElementById('display');
        const btn = document.getElementById('actionBtn');

        // 加载数据
        async function loadData() {
            try {
                // 并行加载订单和中奖名单
                const [ordersRes, winnersRes] = await Promise.all([
                    fetch('/api/get_orders'),
                    fetch('/api/get_winners')
                ]);

                if (ordersRes.ok) fullOrders = await ordersRes.json();
                else console.warn("Failed to load orders from API");

                if (winnersRes.ok) winners = await winnersRes.json();
                else console.warn("Failed to load winners from API");

                // 如果API失败，尝试读取本地文件作为降级（主要针对 orders.json）
                if (fullOrders.length === 0) {
                    try {
                        const res = await fetch('./orders.json');
                        if (res.ok) fullOrders = await res.json();
                    } catch(e) {
                        console.error("Fallback load failed", e);
                    }
                }

                // 过滤掉已中奖的订单
                const winnerSet = new Set(winners.map(w => w.no));
                pool = fullOrders.filter(order => !winnerSet.has(order));

                console.log(`Loaded: ${fullOrders.length} total, ${winners.length} winners, ${pool.length} available.`);

                if (pool.length > 0) {
                    initLotterySystem();
                } else {
                    display.textContent = "奖池已空";
                    btn.disabled = true;
                    btn.style.opacity = 0.5;
                }

                // 恢复历史记录显示 (可选，如果想在刷新后看到之前的中奖记录)
                // renderHistory(winners); 

            } catch (e) {
                console.error("Critical error loading data:", e);
                display.textContent = "数据错误";
            }
        }

        function initLotterySystem() {
             // 计算最大长度
            MAX_LEN = Math.max(...pool.map(o => o.length));
            
            // 为了让滚动效果更连贯，重复多次
            STRIP_CONTENT = (CHARS + CHARS).split('').map(n => `<div>${n}</div>`).join('') + `<div>&nbsp;</div>`; 
            
            initSlots();
        }

        // 初始化显示槽
        function initSlots() {
            display.innerHTML = '';
            for (let i = 0; i < MAX_LEN; i++) {
                const slot = document.createElement('div');
                slot.className = 'digit-slot';
                const strip = document.createElement('div');
                strip.className = 'digit-strip';
                strip.innerHTML = STRIP_CONTENT;
                slot.appendChild(strip);
                display.appendChild(slot);
            }
        }

        // 启动加载
        loadData();

        function startLottery() {
            if (isRunning) return;
            if (pool.length === 0) {
                alert('奖池已空，无法抽奖');
                return;
            }
            isRunning = true;
            btn.textContent = "停止";
            btn.classList.add('stop');
            display.classList.remove('winner');
            
            // 为每个槽位添加滚动动画类
            const slots = document.querySelectorAll('.digit-slot');
            slots.forEach((slot, index) => {
                slot.classList.add('scrolling');
                slot.querySelector('.digit-strip').style.animationDelay = `-${Math.random() * 0.5}s`;
                slot.querySelector('.digit-strip').style.transform = 'translateY(0)'; 
            });
        }

        function stopLottery() {
            if (!isRunning) return;
            isRunning = false;
            btn.textContent = "开始抽奖";
            btn.classList.remove('stop');
            
            // 随机抽取一个
            const finalIndex = Math.floor(Math.random() * pool.length);
            const winningNumber = pool[finalIndex]; 
            
            // 立即从本地奖池移除，防止连续点击重复中奖
            pool.splice(finalIndex, 1);

            // 提交到服务器
            recordWinner(winningNumber);
            
            const slots = document.querySelectorAll('.digit-slot');
            
            // 计算居中对齐的起始位置
            const len = winningNumber.length;
            const startOffset = Math.floor((MAX_LEN - len) / 2);
            
            slots.forEach((slot, index) => {
                slot.classList.remove('scrolling');
                const strip = slot.querySelector('.digit-strip');
                
                let char = '';
                // 判断当前 slot 是否在显示范围内
                if (index >= startOffset && index < startOffset + len) {
                    char = winningNumber[index - startOffset];
                } else {
                    char = '&nbsp;'; // 空白
                }

                let targetIndex = -1;
                if (char === '&nbsp;') {
                    targetIndex = CHARS.length * 2; // 指向最后一个空白 div
                } else {
                    // 找到字符在 CHARS 中的位置
                    // 优先找第二组的字符，以保证是从上往下滚动的视觉惯性
                    const baseIndex = CHARS.indexOf(char);
                    if (baseIndex !== -1) {
                        targetIndex = baseIndex + CHARS.length; // 使用第二组
                    } else {
                        targetIndex = 0; // fallback
                    }
                }
                
                const lineHeight = 1.2; // em
                const targetY = -(targetIndex * lineHeight);
                
                strip.style.transform = `translateY(${targetY}em)`;
                // 缩短动画时间和间隔，以匹配0.5秒的总等待时间
                strip.style.transition = `transform 0.3s cubic-bezier(0.1, 0.7, 0.1, 1) ${index * 0.01}s`;
            });

            // 动画结束后添加闪烁特效
            setTimeout(() => {
                display.classList.add('winner');
                createConfetti();
                // 记录中奖信息到本地列表
                addToHistory(winningNumber);
            }, 500); 
        }

        async function recordWinner(number) {
            try {
                const now = new Date();
                const timeStr = now.getFullYear() + '-' + 
                                (now.getMonth()+1).toString().padStart(2, '0') + '-' + 
                                now.getDate().toString().padStart(2, '0') + ' ' + 
                                now.getHours().toString().padStart(2, '0') + ':' + 
                                now.getMinutes().toString().padStart(2, '0') + ':' + 
                                now.getSeconds().toString().padStart(2, '0');

                await fetch('/api/record_winner', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        no: number,
                        time: timeStr
                    })
                });
            } catch (e) {
                console.error("Failed to record winner on server", e);
                // 这里可以做一个失败重试队列，但Demo版暂不处理
            }
        }

        function toggleLottery() {
            if (isRunning) {
                stopLottery();
            } else {
                startLottery();
            }
        }

        // 绑定事件
        btn.addEventListener('click', toggleLottery);
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // 防止页面滚动
                // 如果登录遮罩层还在显示，不触发抽奖
                if (document.getElementById('loginOverlay').style.display !== 'none') {
                    return;
                }
                toggleLottery();
            }
        });

        // 添加中奖记录
        function addToHistory(number) {
            const list = document.getElementById('historyList');
            // 如果是第一次添加，清空"暂无记录"提示
            if (list.children.length === 1 && list.children[0].textContent.trim() === '暂无中奖记录') {
                list.innerHTML = '';
            }

            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + 
                            now.getMinutes().toString().padStart(2, '0') + ':' + 
                            now.getSeconds().toString().padStart(2, '0');
            
            const item = document.createElement('div');
            item.className = 'history-item';
            
            // 简单动画效果
            item.style.opacity = '0';
            item.style.transform = 'translateX(-20px)';
            item.style.transition = 'all 0.5s ease';
            
            item.innerHTML = `<span>${number}</span><span class="history-time">${timeStr}</span>`;
            
            // 插入到最前面
            list.insertBefore(item, list.firstChild);
            
            // 触发重绘以执行动画
            setTimeout(() => {
                item.style.opacity = '1';
                item.style.transform = 'translateX(0)';
            }, 50);

            // 保持最近1000条
            if (list.children.length > 1000) {
                list.removeChild(list.lastChild);
            }
        }

        // 简单的礼花特效
        function createConfetti() {
            const colors = ['#f1c40f', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = -10 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 1) + 's';
                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 3000);
            }
        }
    </script>
</body>
</html>
